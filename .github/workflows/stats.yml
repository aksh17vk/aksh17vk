name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch contribution data
        run: |
          python - <<'PY'
          import urllib.request
          import re

          username = "aksh17vk"
          url = f"https://github.com/users/{username}/contributions"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "github-actions"}
          )

          data = urllib.request.urlopen(req).read().decode("utf-8")

          # Extract contribution counts from aria-labels
          values = re.findall(
              r'aria-label="(\d+) contributions?',
              data
          )

          total = sum(int(x) for x in values)

          print(f"Contribution count: {total}")

          with open("contributions.txt", "w") as f:
              f.write(str(total))
          PY

      - name: Generate custom stats card
        run: |
          python - <<'PY'
          from pathlib import Path

          username = "aksh17vk"
          total = Path("contributions.txt").read_text().strip()

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300">
            <rect width="700" height="300" rx="12" fill="#1a1b27"/>

            <text x="40" y="55"
                  fill="#70a5fd"
                  font-family="Arial, sans-serif"
                  font-size="25"
                  font-weight="bold">
              {username}'s GitHub Stats
            </text>

            <text x="40" y="105"
                  fill="#a9b1d6"
                  font-family="Arial, sans-serif"
                  font-size="17">
              Total Contributions
            </text>

            <text x="40" y="150"
                  fill="#38bdf8"
                  font-family="Arial, sans-serif"
                  font-size="38"
                  font-weight="bold">
              {total}
            </text>

            <text x="40" y="195"
                  fill="#a9b1d6"
                  font-family="Arial, sans-serif"
                  font-size="16">
              Contributions in the last year
            </text>

            <line x1="360" y1="70" x2="360" y2="230"
                  stroke="#414868"
                  stroke-width="2"/>

            <text x="410" y="115"
                  fill="#bb9af7"
                  font-family="Arial, sans-serif"
                  font-size="18"
                  font-weight="bold">
              Keep Building
            </text>

            <text x="410" y="155"
                  fill="#7dcfff"
                  font-family="Arial, sans-serif"
                  font-size="16">
              Code • Learn • Build
            </text>

            <text x="410" y="190"
                  fill="#9ece6a"
                  font-family="Arial, sans-serif"
                  font-size="15">
              @{username}
            </text>
          </svg>'''

          Path("profile/stats.svg").write_text(svg)
          PY

      - name: Update Top Languages
        run: |
          curl -L \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=aksh17vk&layout=compact&langs_count=10&hide_border=true&theme=tokyonight" \
            -o profile/top-langs.svg

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          git diff --cached --quiet || git commit -m "Update GitHub contribution stats"

          git push
